    waSub: { hi: 'चैनल से जुड़ें — हर दिन नए दर्शन', en: 'Join the channel — new darshan every day', pa: 'ਚੈਨਲ ਨਾਲ ਜੁੜੋ — ਹਰ ਦਿਨ ਨਵੇਂ ਦਰਸ਼ਨ', gu: 'ચેનલ સાથે જોડાઓ — દરરોજ નવા દર્શન' },
    vishesh: { hi: 'बाबा श्याम के दिव्य दर्शन', en: 'Divine darshan of Baba Shyam', pa: 'ਬਾਬਾ ਸ਼ਿਆਮ ਦੇ ਦਿਵ੍ਯ ਦਰਸ਼ਨ', gu: 'બાબા શ્યામના દિવ્ય દર્શન' },
    visheshSub: { hi: 'हर एकादशी नए विशेष दर्शन · यहाँ देखें', en: 'New special darshan every Ekadashi', pa: 'ਹਰ ਏਕਾਦਸ਼ੀ ਨਵੇਂ ਖ਼ਾਸ ਦਰਸ਼ਨ', gu: 'દરેક એકાદશીએ નવા વિશેષ દર્શન' },
    panchang: { hi: 'आज का पंचांग', en: "Today's Panchang", pa: 'ਅੱਜ ਦਾ ਪੰਚਾਂਗ', gu: 'આજનું પંચાંગ' },
    panchangSub: { hi: 'तिथि, व्रत और त्योहार — खाटू धाम के अनुसार', en: 'Tithi, vrat and festivals — as per Khatu Dham', pa: 'ਤਿਥੀ, ਵਰਤ ਤੇ ਤਿਉਹਾਰ — ਖਾਟੂ ਧਾਮ ਅਨੁਸਾਰ', gu: 'તિથિ, વ્રત અને તહેવાર — ખાટુ ધામ મુજબ' },
    empty: { hi: 'आज के दर्शन जल्द ही आ रहे हैं', en: "Today's darshan is coming soon", pa: 'ਅੱਜ ਦੇ ਦਰਸ਼ਨ ਜਲਦੀ ਆ ਰਹੇ ਹਨ', gu: 'આજના દર્શન જલદી આવી રહ્યા છે' },
    offline: { hi: 'दर्शन लोड नहीं हो पाए — इंटरनेट चेक करें', en: "Couldn't load the darshan — check your internet", pa: 'ਦਰਸ਼ਨ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕੇ — ਇੰਟਰਨੈੱਟ ਚੈੱਕ ਕਰੋ', gu: 'દર્શન લોડ ન થઈ શક્યા — ઇન્ટરનેટ તપાસો' },
    retry: { hi: 'फिर कोशिश करें', en: 'Try again', pa: 'ਫਿਰ ਕੋਸ਼ਿਸ਼ ਕਰੋ', gu: 'ફરી પ્રયાસ કરો' },
    close: { hi: 'बंद करें', en: 'Close', pa: 'ਬੰਦ ਕਰੋ', gu: 'બંધ કરો' },
    nfTitle: { hi: 'यह पेज नहीं मिला', en: 'Page not found', pa: 'ਇਹ ਪੰਨਾ ਨਹੀਂ ਮਿਲਿਆ', gu: 'આ પેજ મળ્યું નથી' },
    nfSub: { hi: 'कोई बात नहीं — बाबा श्याम के आज के दर्शन कीजिए 🙏', en: "No worries — have Baba Shyam's darshan today 🙏", pa: 'ਕੋਈ ਗੱਲ ਨਹੀਂ — ਬਾਬਾ ਸ਼ਿਆਮ ਦੇ ਅੱਜ ਦੇ ਦਰਸ਼ਨ ਕਰੋ 🙏', gu: 'કોઈ વાંધો નહીં — બાબા શ્યામના આજના દર્શન કરો 🙏' },
    nfHome: { hi: 'होम पेज', en: 'Home page', pa: 'ਹੋਮ ਪੇਜ', gu: 'હોમ પેજ' },
  };
  // Served as the site's 404 page too (build-web.js writes /404.html).
  var notFound = !KA.inApp && document.body.getAttribute('data-variant') === '404';
  var PAKSHA = {
    shukla: { hi: 'शुक्ल', en: 'Shukla', pa: 'ਸ਼ੁਕਲ', gu: 'શુક્લ' },
    krishna: { hi: 'कृष्ण', en: 'Krishna', pa: 'ਕ੍ਰਿਸ਼ਨ', gu: 'કૃષ્ણ' },
  };
  var t = function (k) { return KA.tr(T[k]); };

  var ICON = {
    share: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>',
    expand: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
    wa: '<svg viewBox="0 0 24 24"><path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    prev: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  };

  // ─── Data ──────────────────────────────────────────────────────────────────
  // status: loading (nothing yet) | ready | empty (admin set none) | error
  var state = { ids: [], updatedAt: null, status: 'loading', active: 0, fetchedAt: 0 };

  try {
    var cached = JSON.parse(KA.store.get(CACHE_KEY) || 'null');
    if (cached && Array.isArray(cached.ids)) {
      state.ids = cached.ids;
      state.updatedAt = cached.updatedAt || null;
      state.status = cached.ids.length ? 'ready' : 'empty';
    }
  } catch (e) { /* bad cache */ }

  var imgUrl = function (id, w) {
    return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w;
  };
  // Sharp on high-density phones without pulling a desktop-size file.
  function slideWidth() {
    var px = Math.min(window.innerWidth, 560) * (window.devicePixelRatio || 1);
    return px > 1100 ? 1600 : px > 640 ? 1000 : 700;
  }

  function fetchLatest() {
    state.fetchedAt = Date.now();
    return fetch(SUPA_URL + '/rest/v1/daily_darshan?select=file_ids,updated_at&id=eq.1', {
      headers: { apikey: SUPA_KEY, Accept: 'application/json' },
      cache: 'no-store',
    }).then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    }).then(function (rows) {
      var row = rows && rows[0] ? rows[0] : {};
      var ids = (row.file_ids || []).filter(function (s) { return s && String(s).trim(); })
        .map(function (s) { return String(s).trim(); }).slice(0, 3);
      var updatedAt = row.updated_at || null;
      KA.store.set(CACHE_KEY, JSON.stringify({ ids: ids, updatedAt: updatedAt }));
      var changed = ids.join() !== state.ids.join() || updatedAt !== state.updatedAt || state.status !== (ids.length ? 'ready' : 'empty');
      state.ids = ids;
      state.updatedAt = updatedAt;
      state.status = ids.length ? 'ready' : 'empty';
      if (changed) { state.active = 0; render(); }
    }).catch(function () {
      if (state.status === 'loading') { state.status = 'error'; render(); }
    });
  }

  // Same text the app has always shared (WhatsApp channel + Play Store) —
  // Hindi in every language, as before.
  var HINDI_MONTHS = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];
  function caption() {
    var d = state.updatedAt ? KA.istDay(new Date(state.updatedAt)) : null;
    var dateLabel = d ? d.getDate() + ' ' + HINDI_MONTHS[d.getMonth()] + ' ' + d.getFullYear() : '';
    return [
      '🌸 बाबा श्याम के आज के दिव्य दर्शन 🌸',
      'आज के दर्शन के लिए इस लिंक पर क्लिक करें 👉 ' + WA_URL,
      dateLabel ? '📅 ' + dateLabel : '',
      'जय श्री श्याम 🙏',
      'बाबा खाटू श्याम जी के रोज़ नए दर्शन, आरती, भजन, कीर्तन और नाम जप — सब एक ही ऐप में।',
      '📿 आप भी नाम जप संकल्प से जुड़ें — हर जप का lifetime count, माला (108) tracking और वेगवान जप mode।',
      '📱 ऐप डाउनलोड करें:',
      KA.PLAY_URL,
    ].filter(Boolean).join('\n');
  }

  // ─── Render ────────────────────────────────────────────────────────────────
  var app = document.getElementById('app');
  var timer = null;
  var resumeAt = 0;
  // Prebuilt off screen in the app: the carousel waits until it's shown.
  var hidden = !!(KA.env && KA.env.active === false);

  function head() {
    var d = KA.today();
    var first = P.getTithiSpans(d, KA.lang)[0];
    var pc = P.getPanchang(P.sunriseOf(d), KA.lang);
    var tithi = pc.hinduMonth + ' ' + KA.tr(PAKSHA[first.idx < 15 ? 'shukla' : 'krishna']) + ' ' + first.name;
    return '<header class="head">' +
      '<h1 class="title"><span aria-hidden="true">🌸</span><span class="shine">' + esc(t('title')) + '</span></h1>' +
      '<div class="sub"><span>' + esc(KA.longDate(d)) + '</span>' +
      '<button class="tithi-chip tap" id="tithi">' + ICON.cal + esc(tithi) + '</button></div>' +
      '</header>';
  }

  function viewer() {
    if (state.status === 'loading') {
      return '<section class="viewer"><span class="frame skel"></span></section>';
    }
    if (state.status === 'error' || state.status === 'empty') {
      var err = state.status === 'error';
      return '<section class="card state"><div class="state-icon">' + (err ? '📶' : '🙏') + '</div>' +
        '<p>' + esc(t(err ? 'offline' : 'empty')) + '</p>' +
        (err ? '<button class="retry tap" id="retry">' + esc(t('retry')) + '</button>' : '') + '</section>';
    }
    var w = slideWidth();
    var slides = state.ids.map(function (id, i) {
      return '<button class="slide" data-i="' + i + '" aria-label="' + esc(t('title') + ' ' + (i + 1)) + '">' +
        '<span class="frame skel"><img alt="" decoding="async"' + (i ? ' loading="lazy"' : '') + ' src="' + imgUrl(id, w) + '"></span>' +
        '<span class="zoom">' + ICON.expand + '</span></button>';
    }).join('');
    var dots = state.ids.length > 1
      ? '<div class="dots">' + state.ids.map(function (_, i) { return '<i' + (i === state.active ? ' class="on"' : '') + '></i>'; }).join('') + '</div>'
      : '';
    var updated = state.updatedAt
      ? '<p class="updated">' + esc(fill(t('updated'), { d: KA.dayMonth(KA.istDay(new Date(state.updatedAt))) + ', ' + KA.time(new Date(state.updatedAt)) })) + '</p>'
      : '';
    return '<section class="viewer"><div class="viewer-glow"></div><div class="track" id="track">' + slides + '</div>' + dots + '</section>' +
      '<section class="share-box"><p class="share-prompt">' + esc(t('sharePrompt')) + '</p>' +
      '<button class="share-btn" id="share">' + ICON.share + '<span>' + esc(t('share')) + '</span></button>' + updated + '</section>';
  }

  function links() {
    var card = function (id, iconCls, icon, title, sub, href) {
      var inner = '<span class="li-icon ' + iconCls + '">' + icon + '</span>' +
        '<span class="li-body"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span>' + ICON.chev;
      return href
        ? '<a class="link-card tap" href="' + href + '">' + inner + '</a>'
        : '<button class="link-card tap" id="' + id + '">' + inner + '</button>';
    };
    return '<section class="links">' +
      card('wa', 'wa', ICON.wa, t('waTitle'), t('waSub')) +
      (KA.inApp
        ? card('vishesh', 'gold', ICON.eye, t('vishesh'), t('visheshSub'))
        : card('', 'gold', ICON.cal, t('panchang'), t('panchangSub'), '/panchang/')) +
      '</section>';
  }

  function render() {
    document.title = (notFound ? t('nfTitle') + ' · ' : '') + t('pageTitle');
    if (notFound) {
      document.getElementById('nf').innerHTML = '<div class="nf-card"><span class="nf-code">404</span>' +
        '<span class="nf-text"><b>' + esc(t('nfTitle')) + '</b><small>' + esc(t('nfSub')) + '</small></span>' +
        '<a class="nf-home tap" href="/">' + esc(t('nfHome')) + '</a></div>';
    }
    app.innerHTML = head() + viewer() + links();
    bindImages();
    bindCarousel();
  }

  function bindImages() {
    Array.prototype.forEach.call(app.querySelectorAll('.frame img'), function (img) {
      var frame = img.parentNode;
      var done = function () { frame.classList.remove('skel'); img.classList.add('in'); };
      var fail = function () { frame.classList.remove('skel'); frame.classList.add('broken'); };
      if (img.complete && img.naturalWidth) done();
      else { img.addEventListener('load', done); img.addEventListener('error', fail); }
    });
  }

  function bindCarousel() {
    clearInterval(timer);
    var track = document.getElementById('track');
    if (!track) return;
    var dots = app.querySelectorAll('.dots i');
    var n = state.ids.length;
    if (state.active) track.scrollLeft = state.active * track.clientWidth;
    track.addEventListener('scroll', function () {
      var i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      if (i === state.active) return;
      state.active = i;
      Array.prototype.forEach.call(dots, function (d, j) { d.classList.toggle('on', j === i); });
    }, { passive: true });
    var hold = function () { resumeAt = Date.now() + 6000; };
    track.addEventListener('touchstart', hold, { passive: true });
    track.addEventListener('pointerdown', hold);
    if (n > 1) {
      timer = setInterval(function () {
        if (hidden || document.hidden || Date.now() < resumeAt) return;
        var next = (state.active + 1) % n;
        track.scrollTo({ left: next * track.clientWidth, behavior: 'smooth' });
      }, AUTO_MS);
    }
  }

  // ─── Actions ───────────────────────────────────────────────────────────────
  function openImage(i) {
    var id = state.ids[i];
    if (!id) return;
    KA.haptic();
    if (KA.inApp) {
      KA.post({ t: 'image', id: id, shareText: caption() });
      return;
    }
    lightbox(i);
  }

  function lightbox(i) {
    var box = document.createElement('div');
    box.className = 'lb';
    var many = state.ids.length > 1;
    var paint = function () {
      box.innerHTML = '<img alt="" src="' + imgUrl(state.ids[i], 1600) + '">' +
        '<button class="lb-btn lb-close tap" data-a="close" aria-label="' + esc(t('close')) + '">' + ICON.close + '</button>' +
        (many ? '<button class="lb-btn lb-prev tap" data-a="prev" aria-label="‹">' + ICON.prev + '</button>' +
                '<button class="lb-btn lb-next tap" data-a="next" aria-label="›">' + ICON.next + '</button>' : '') +
        '<button class="share-btn" data-a="share">' + ICON.share + '<span>' + esc(t('share')) + '</span></button>';
      // Fade in once loaded, so the gold frame doesn't flash empty first.
      var img = box.querySelector('img');
      var shown = function () { img.classList.add('in'); };
      if (img.complete && img.naturalWidth) shown();
      else {
        img.addEventListener('load', shown);
        img.addEventListener('error', function () { img.style.display = 'none'; });
      }
    };
    var close = function () {
      box.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(function () { box.remove(); }, 200);
    };
    var step = function (dir) { i = (i + dir + state.ids.length) % state.ids.length; paint(); };
    var onKey = function (e) {
      if (e.key === 'Escape') close();
      else if (many && e.key === 'ArrowRight') step(1);
      else if (many && e.key === 'ArrowLeft') step(-1);
    };
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      var a = b ? b.dataset.a : (e.target.tagName === 'IMG' ? null : 'close');
      if (a === 'close') close();
      else if (a === 'prev') step(-1);
      else if (a === 'next') step(1);
      else if (a === 'share') KA.share(caption(), t('title'));
    });
    document.addEventListener('keydown', onKey);
    paint();
    document.body.appendChild(box);
    requestAnimationFrame(function () { box.classList.add('show'); });
  }

  app.addEventListener('click', function (e) {
    var slide = e.target.closest('.slide');
    if (slide) return openImage(+slide.dataset.i);
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'share') { KA.haptic(); KA.share(caption(), t('title')); }
    else if (b.id === 'retry') { KA.haptic(); state.status = 'loading'; render(); fetchLatest(); }
    else if (b.id === 'wa') { KA.haptic(); KA.open(WA_URL); }
    else if (b.id === 'vishesh') { KA.haptic(); KA.post({ t: 'nav', screen: 'Darshan' }); }
    else if (b.id === 'tithi') {
      KA.haptic();
      if (KA.inApp) KA.post({ t: 'panchang' });
      else location.href = '/panchang/';
    }
  });

  KA.on(function (m) {
    if (m.t === 'lang') render();
    else if (m.t === 'focus') {
      hidden = false;
      // The tab stays mounted all day — refresh the header date and the images.
      document.querySelector('.head').outerHTML = head();
      if (Date.now() - state.fetchedAt > 5 * 60000) fetchLatest();
    } else if (m.t === 'blur') hidden = true;
  });

  if (KA.inApp) {
    window.addEventListener('scroll', function () {
      document.documentElement.classList.toggle('scrolled', window.scrollY > 4);
    }, { passive: true });
  }

  KA.chrome(notFound ? '' : 'darshan');
  render();
  KA.ready();
  fetchLatest();
})();
</script>
</body>
</html>
